name: Publish legal pages

# Publishes the static pages in legal/ to GitHub Pages whenever they change on main.
# One-time setup in the repo: Settings > Pages > Build and deployment > Source: GitHub Actions.
# GitHub Pages is free for public repositories only.

on:
  push:
    branches: [main]
    paths:
      - 'legal/**'
      - '.github/workflows/legal-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      # Publish only the pages, not the README with internal notes.
      - name: Collect pages
        run: |
          mkdir _site
          cp legal/*.html legal/style.css _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
